<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Learning-rate schedule shape</title>
<desc>Axes of learning rate against training step with a marker at warmup_steps and both curve segments left blank.</desc>
<rect x="12" y="12" width="376" height="216" rx="12" fill="#F1EFE8"/>
<rect x="60" y="28" width="316" height="140" rx="6" fill="#FFFFFF"/>
<path d="M60 28V168H376" stroke="#2C2C2A" stroke-width="1.5" fill="none"/>
<path d="M150 32V168" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
<g font-size="15" font-weight="700" text-anchor="middle" fill="#633806">
<rect x="84" y="84" width="40" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="104" y="104">?</text>
<rect x="244" y="84" width="40" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="264" y="104">?</text>
</g>
<g font-size="13" fill="#2C2C2A">
<text x="20" y="100" transform="rotate(-90 26 98)" text-anchor="middle">rate</text>
<text x="150" y="186" text-anchor="middle">warmup_steps</text>
<text x="330" y="186" text-anchor="middle">step →</text>
<text x="200" y="214" text-anchor="middle" fill="#5F5E5A">How does the rate move on each side? Eq. 3, p. 7</text>
</g>
</svg>
