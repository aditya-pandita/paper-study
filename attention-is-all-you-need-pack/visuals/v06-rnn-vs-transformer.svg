<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>What changed: recurrence vs self-attention</title>
<desc>Side by side: recurrent layer passes a state step by step (O(n) sequential steps, O(n) path); self-attention links every pair directly (O(1) steps, O(1) path) at O(n squared times d) cost.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker></defs>
<rect x="24" y="24" width="752" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="400" y="51" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="middle">What changed: one step at a time vs all at once</text>
<rect x="24" y="80" width="364" height="384" rx="12" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="412" y="80" width="364" height="384" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="206" y="110" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">Recurrent layer (before)</text>
<text x="594" y="110" font-size="15" font-weight="700" fill="#085041" text-anchor="middle">Self-attention (this paper)</text>
<g stroke="#5F5E5A" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M92 200H113"/><path d="M159 200H180"/><path d="M226 200H247"/><path d="M293 200H314"/>
</g>
<g stroke="#0F6E56" stroke-width="1.5" fill="none">
<path d="M594 135L661 183M594 135L635 262M594 135L553 262M594 135L527 183M661 183L635 262M661 183L553 262M661 183L527 183M635 262L553 262M635 262L527 183M553 262L527 183"/>
</g>
<g font-size="15" text-anchor="middle">
<circle cx="70" cy="200" r="20" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="2"/><text x="70" y="205" fill="#2C2C2A">h1</text>
<circle cx="137" cy="200" r="20" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="2"/><text x="137" y="205" fill="#2C2C2A">h2</text>
<circle cx="204" cy="200" r="20" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="2"/><text x="204" y="205" fill="#2C2C2A">h3</text>
<circle cx="271" cy="200" r="20" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="2"/><text x="271" y="205" fill="#2C2C2A">h4</text>
<circle cx="338" cy="200" r="20" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="2"/><text x="338" y="205" fill="#2C2C2A">h5</text>
<circle cx="594" cy="135" r="20" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/><text x="594" y="140" fill="#085041">1</text>
<circle cx="661" cy="183" r="20" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/><text x="661" y="188" fill="#085041">2</text>
<circle cx="635" cy="262" r="20" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/><text x="635" y="267" fill="#085041">3</text>
<circle cx="553" cy="262" r="20" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/><text x="553" y="267" fill="#085041">4</text>
<circle cx="527" cy="183" r="20" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/><text x="527" y="188" fill="#085041">5</text>
</g>
<g font-size="13" text-anchor="middle">
<text x="206" y="256" fill="#2C2C2A">Each state waits for the one before it.</text>
<text x="594" y="304" fill="#085041">Every position links to every other.</text>
</g>
<g font-size="15">
<rect x="40" y="320" width="332" height="36" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/><text x="56" y="343" fill="#2C2C2A">Steps in sequence: O(n)</text>
<rect x="40" y="364" width="332" height="36" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/><text x="56" y="387" fill="#2C2C2A">Longest path: O(n)</text>
<rect x="40" y="408" width="332" height="36" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/><text x="56" y="431" fill="#2C2C2A">Work per layer: O(n · d²)</text>
<rect x="428" y="320" width="332" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B"/><text x="444" y="343" fill="#633806">Steps in sequence: O(1)</text>
<rect x="428" y="364" width="332" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B"/><text x="444" y="387" fill="#633806">Longest path: O(1)</text>
<rect x="428" y="408" width="332" height="36" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="444" y="431" fill="#712B13">Work per layer: O(n² · d)</text>
</g>
<g font-size="13">
<rect x="24" y="478" width="96" height="26" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="72" y="496" fill="#2C2C2A" text-anchor="middle">Key:</text>
<rect x="128" y="478" width="196" height="26" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="226" y="496" fill="#633806" text-anchor="middle">better than recurrence</text>
<rect x="332" y="478" width="300" height="26" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="482" y="496" fill="#712B13" text-anchor="middle">worse when sentences are long (n &gt; d)</text>
<rect x="24" y="518" width="752" height="50" rx="6" fill="#F1EFE8"/>
<text fill="#2C2C2A" text-anchor="middle"><tspan x="400" y="538">Redrawn and simplified from Table 1, p. 6. n = sentence length, d = vector size.</tspan><tspan x="400" y="556">Convolution (not shown): O(1) steps, path O(log_k n) with dilated kernels.</tspan></text>
</g>
</svg>
