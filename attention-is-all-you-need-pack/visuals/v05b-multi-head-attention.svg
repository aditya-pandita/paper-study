<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Multi-head attention</title>
<desc>Q, K, V each projected h = 8 times to 64 dimensions, attention run in each head in parallel, outputs concatenated and projected back to 512.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker></defs>
<rect x="24" y="24" width="752" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="400" y="51" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="middle">Many small attentions side by side</text>
<g font-size="15" text-anchor="middle">
<rect x="24" y="98" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="79" y="125" fill="#0C447C">Q (512)</text>
<rect x="24" y="168" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="79" y="195" fill="#0C447C">K (512)</text>
<rect x="24" y="238" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="79" y="265" fill="#0C447C">V (512)</text>
<rect x="178" y="150" width="170" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text fill="#085041"><tspan x="263" y="178">Learned linear</tspan><tspan x="263" y="198">projections,</tspan><tspan x="263" y="218">one set per head</tspan></text>
<rect x="420" y="120" width="230" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" opacity=".55"/>
<rect x="410" y="130" width="230" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" opacity=".75"/>
<rect x="400" y="140" width="230" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text fill="#085041"><tspan x="515" y="170">h = 8 heads in parallel</tspan><tspan x="515" y="192">each: scaled dot-product</tspan><tspan x="515" y="214">attention on 64 dims</tspan></text>
<rect x="400" y="300" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text fill="#085041"><tspan x="515" y="323">Concatenate</tspan><tspan x="515" y="344">the 8 head outputs</tspan></text>
<rect x="400" y="392" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text fill="#085041"><tspan x="515" y="415">Linear projection</tspan><tspan x="515" y="436">W^O</tspan></text>
<rect x="124" y="392" width="224" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text fill="#633806"><tspan x="236" y="415">Output: back to</tspan><tspan x="236" y="436">512 numbers</tspan></text>
</g>
<g stroke="#5F5E5A" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M136 120L176 168"/><path d="M136 190H176"/><path d="M136 260L176 212"/>
<path d="M350 190H398"/>
<path d="M515 238V298"/><path d="M515 358V390"/><path d="M398 420H350"/>
</g>
<g font-size="13">
<rect x="24" y="474" width="62" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="55" y="491" fill="#0C447C" text-anchor="middle">input</text>
<rect x="94" y="474" width="62" height="24" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="125" y="491" fill="#085041" text-anchor="middle">step</text>
<rect x="164" y="474" width="70" height="24" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="199" y="491" fill="#633806" text-anchor="middle">output</text>
<rect x="24" y="510" width="752" height="30" rx="6" fill="#F1EFE8"/>
<text x="400" y="530" fill="#2C2C2A" text-anchor="middle">Redrawn and simplified from Fig. 2 (right), p. 4, and Sec. 3.2.2, p. 5 (h = 8, d_k = d_v = 64).</text>
</g>
</svg>
