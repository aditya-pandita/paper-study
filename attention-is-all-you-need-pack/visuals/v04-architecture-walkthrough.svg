<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Reading Figure 1 step by step</title>
<desc>The architecture figure redrawn with five numbered callouts: embeddings and position, encoder layer, masked decoder self-attention, encoder-decoder attention, output projection.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker></defs>
<rect x="24" y="24" width="752" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="400" y="51" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="middle">Reading Figure 1 in five steps</text>
<g font-size="15" text-anchor="middle">
<rect x="262" y="78" width="168" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="346" y="103" fill="#633806">Next-token probs</text>
<rect x="262" y="138" width="168" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="346" y="163" fill="#085041">Linear + softmax</text>
<rect x="244" y="198" width="204" height="282" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-dasharray="6 4"/>
<rect x="258" y="214" width="176" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="346" y="241" fill="#085041">Feed-forward</text>
<rect x="258" y="318" width="176" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="346" y="345" fill="#085041">Enc-dec attention</text>
<rect x="258" y="412" width="176" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="346" y="439" fill="#085041">Masked self-attn</text>
<rect x="24" y="292" width="204" height="188" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-dasharray="6 4"/>
<rect x="38" y="318" width="176" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="126" y="345" fill="#085041">Feed-forward</text>
<rect x="38" y="412" width="176" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="126" y="439" fill="#085041">Self-attention</text>
<rect x="24" y="512" width="204" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text fill="#0C447C"><tspan x="126" y="534">Input embedding</tspan><tspan x="126" y="554">+ position</tspan></text>
<rect x="244" y="512" width="204" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text fill="#0C447C"><tspan x="346" y="534">Output embedding</tspan><tspan x="346" y="554">+ position</tspan></text>
</g>
<g font-size="13" text-anchor="middle" fill="#2C2C2A">
<rect x="32" y="298" width="44" height="22" rx="6" fill="#FFFFFF" stroke="#5F5E5A"/><text x="54" y="314">×6</text>
<rect x="396" y="456" width="44" height="22" rx="6" fill="#FFFFFF" stroke="#5F5E5A"/><text x="418" y="472">×6</text>
</g>
<g stroke="#5F5E5A" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M126 510V458"/><path d="M126 410V364"/>
<path d="M346 510V458"/><path d="M346 410V364"/><path d="M346 316V260"/><path d="M346 212V180"/><path d="M346 136V120"/>
<path d="M126 316V272H236V340H256"/>
</g>
<g font-size="15" font-weight="700" text-anchor="middle" fill="#2C2C2A">
<circle cx="228" cy="512" r="14" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="228" y="517">1</text>
<circle cx="214" cy="412" r="14" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="214" y="417">2</text>
<circle cx="434" cy="412" r="14" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="434" y="417">3</text>
<circle cx="434" cy="318" r="14" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="434" y="323">4</text>
<circle cx="430" cy="138" r="14" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="430" y="143">5</text>
</g>
<rect x="472" y="78" width="304" height="486" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="490" y="104" font-size="15" font-weight="600" fill="#2C2C2A">Reading order</text>
<g font-size="13" fill="#2C2C2A">
<circle cx="500" cy="134" r="12" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="500" y="139" text-anchor="middle" font-weight="700">1</text>
<text><tspan x="522" y="132">Tokens become vectors of size</tspan><tspan x="522" y="150">512; position codes are added.</tspan><tspan x="522" y="168">Sec. 3.4 and 3.5</tspan></text>
<circle cx="500" cy="210" r="12" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="500" y="215" text-anchor="middle" font-weight="700">2</text>
<text><tspan x="522" y="208">One encoder layer: attention,</tspan><tspan x="522" y="226">then feed-forward. Six are</tspan><tspan x="522" y="244">stacked. Sec. 3.1</tspan></text>
<circle cx="500" cy="286" r="12" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="500" y="291" text-anchor="middle" font-weight="700">3</text>
<text><tspan x="522" y="284">The decoder's first block is</tspan><tspan x="522" y="302">masked. Ask: masked from what?</tspan><tspan x="522" y="320">Sec. 3.1</tspan></text>
<circle cx="500" cy="362" r="12" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="500" y="367" text-anchor="middle" font-weight="700">4</text>
<text><tspan x="522" y="360">The arrow from the encoder</tspan><tspan x="522" y="378">enters here. Which inputs does</tspan><tspan x="522" y="396">it supply? Sec. 3.2.3</tspan></text>
<circle cx="500" cy="438" r="12" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="500" y="443" text-anchor="middle" font-weight="700">5</text>
<text><tspan x="522" y="436">A linear layer and softmax</tspan><tspan x="522" y="454">score every word for the next</tspan><tspan x="522" y="472">position. Sec. 3.4</tspan></text>
</g>
<g font-size="13">
<rect x="490" y="500" width="62" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="521" y="517" fill="#0C447C" text-anchor="middle">input</text>
<rect x="560" y="500" width="62" height="24" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="591" y="517" fill="#085041" text-anchor="middle">step</text>
<rect x="630" y="500" width="70" height="24" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="665" y="517" fill="#633806" text-anchor="middle">output</text>
<text x="490" y="548" fill="#2C2C2A">Read from the bottom up.</text>
<rect x="24" y="584" width="752" height="52" rx="6" fill="#F1EFE8"/>
<text fill="#2C2C2A" text-anchor="middle"><tspan x="400" y="605">Redrawn and simplified from Fig. 1, p. 3. Not shown: each block is followed</tspan><tspan x="400" y="623">by Add &amp; Norm (residual connection plus layer normalization).</tspan></text>
</g>
</svg>
