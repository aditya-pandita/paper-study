<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Positional encoding</title>
<desc>Token embedding plus a sinusoidal position vector of the same size gives the input to the first layer. Each dimension is a sine or cosine of a different frequency.</desc>
