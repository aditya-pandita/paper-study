<rect x="24" y="92" width="200" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text fill="#0C447C"><tspan x="124" y="117">Token embedding</tspan><tspan x="124" y="138">512 numbers</tspan></text>
<circle cx="262" cy="122" r="18" fill="#F1EFE8" stroke="#5F5E5A"/><text x="262" y="128" font-size="20" fill="#2C2C2A">+</text>
