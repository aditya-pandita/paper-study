<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>How the Transformer works</title>
<desc>Encoder column: embedding plus position, then six layers of self-attention and feed-forward. Decoder column: masked self-attention, encoder-decoder attention fed by the encoder, feed-forward, then linear and softmax to probabilities.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker></defs>
<rect x="24" y="24" width="752" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="400" y="51" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="middle">How the Transformer works</text>
<g font-size="15" text-anchor="middle">
<rect x="80" y="84" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text fill="#0C447C"><tspan x="210" y="107">Input tokens: embedding</tspan><tspan x="210" y="128">+ positional encoding</tspan></text>
<rect x="460" y="84" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text fill="#0C447C"><tspan x="590" y="107">Outputs so far (shifted)</tspan><tspan x="590" y="128">+ positional encoding</tspan></text>
<rect x="60" y="168" width="300" height="200" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-dasharray="6 4"/>
<rect x="236" y="176" width="112" height="24" rx="6" fill="#FFFFFF" stroke="#5F5E5A"/>
<text x="292" y="193" font-size="13" fill="#2C2C2A">Encoder, ×6</text>
<rect x="440" y="168" width="300" height="280" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-dasharray="6 4"/>
<rect x="616" y="176" width="112" height="24" rx="6" fill="#FFFFFF" stroke="#5F5E5A"/>
<text x="672" y="193" font-size="13" fill="#2C2C2A">Decoder, ×6</text>
<rect x="80" y="208" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text fill="#085041"><tspan x="210" y="231">Multi-head</tspan><tspan x="210" y="252">self-attention</tspan></text>
<rect x="80" y="292" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="210" y="325" fill="#085041">Feed-forward</text>
<rect x="460" y="208" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text fill="#085041"><tspan x="590" y="231">Masked multi-head</tspan><tspan x="590" y="252">self-attention</tspan></text>
<rect x="460" y="292" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text fill="#085041"><tspan x="590" y="315">Encoder-decoder</tspan><tspan x="590" y="336">attention</tspan></text>
<rect x="460" y="376" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="590" y="409" fill="#085041">Feed-forward</text>
<rect x="460" y="476" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="590" y="503" fill="#085041">Linear + softmax</text>
<rect x="460" y="552" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text fill="#633806"><tspan x="590" y="575">Probabilities for</tspan><tspan x="590" y="596">the next token</tspan></text>
<rect x="216" y="422" width="168" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
<text x="300" y="440" font-size="13" fill="#0C447C">keys and values</text>
</g>
<g stroke="#5F5E5A" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M210 142V206"/><path d="M210 266V290"/>
<path d="M590 142V206"/><path d="M590 266V290"/><path d="M590 350V374"/><path d="M590 434V474"/><path d="M590 522V550"/>
<path d="M210 350V404H400V320H458"/>
</g>
<g font-size="13">
<rect x="60" y="476" width="110" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="115" y="494" fill="#0C447C" text-anchor="middle">input, data</text>
<rect x="60" y="510" width="110" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="115" y="528" fill="#085041" text-anchor="middle">processing</text>
<rect x="60" y="544" width="110" height="26" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="115" y="562" fill="#633806" text-anchor="middle">output</text>
<rect x="24" y="628" width="752" height="48" rx="6" fill="#F1EFE8"/>
<text fill="#2C2C2A" text-anchor="middle"><tspan x="400" y="648">Redrawn and simplified from Fig. 1, p. 3. Not shown: every sub-layer is</tspan><tspan x="400" y="666">wrapped as LayerNorm(x + Sublayer(x)) (Sec. 3.1). Sizes: d_model = 512.</tspan></text>
</g>
</svg>
