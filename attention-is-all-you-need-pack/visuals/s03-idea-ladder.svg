<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Building blocks, bottom to top</title>
<desc>Stacked blocks from bottom: words as number lists, matching scores, weights that add to one, attention, many heads, the full Transformer.</desc>
<rect x="24" y="24" width="752" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="400" y="51" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="middle">Build it up, one block at a time</text>
<g font-size="15">
<rect x="24" y="436" width="500" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="40" y="466" fill="#0C447C"><tspan font-weight="700">1 </tspan>Words become lists of numbers</text>
<rect x="64" y="378" width="500" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="80" y="408" fill="#0C447C"><tspan font-weight="700">2 </tspan>Add a tag for position</text>
<rect x="104" y="320" width="500" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="120" y="350" fill="#085041"><tspan font-weight="700">3 </tspan>Compare two lists: a match score</text>
<rect x="144" y="262" width="500" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="160" y="292" fill="#085041"><tspan font-weight="700">4 </tspan>Scores become shares adding to 1</text>
<rect x="184" y="204" width="500" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="200" y="234" fill="#085041"><tspan font-weight="700">5 </tspan>Mix in other words by share</text>
<rect x="224" y="146" width="500" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="240" y="176" fill="#085041"><tspan font-weight="700">6 </tspan>Do it 8 ways, then combine</text>
<rect x="264" y="88" width="500" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="280" y="118" fill="#633806"><tspan font-weight="700">7 </tspan>Six layers read, six write</text>
</g>
<g font-size="13">
<rect x="540" y="440" width="236" height="42" rx="6" fill="#F1EFE8"/><text fill="#2C2C2A"><tspan x="552" y="458">Start at the bottom.</tspan><tspan x="552" y="475">Each block needs the one below.</tspan></text>
<rect x="24" y="500" width="752" height="40" rx="6" fill="#F1EFE8"/>
<text fill="#2C2C2A" text-anchor="middle"><tspan x="400" y="516">Simplified from Sec. 3.1-3.5, pp. 3-6. Blocks 3-5 are one attention step (Eq. 1); block 6 is multi-head</tspan><tspan x="400" y="533">attention (Sec. 3.2.2); block 7 is the full model (Fig. 1, p. 3).</tspan></text>
</g>
</svg>
