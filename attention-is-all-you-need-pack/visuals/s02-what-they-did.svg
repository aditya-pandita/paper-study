<g font-size="15" text-anchor="middle">
<rect x="568" y="140" width="176" height="44" rx="8" fill="#FFFFFF" stroke="#854F0B"/><text x="656" y="167" fill="#633806">Better translations</text>
<rect x="568" y="198" width="176" height="44" rx="8" fill="#FFFFFF" stroke="#854F0B"/><text x="656" y="225" fill="#633806">Less training time</text>
<text fill="#712B13"><tspan x="144" y="276">Reads one word,</tspan><tspan x="144" y="298">then the next. Slow.</tspan></text>
<text fill="#085041"><tspan x="400" y="276">Every word looks at</tspan><tspan x="400" y="298">every other word.</tspan></text>
<text fill="#633806"><tspan x="656" y="276">Beat the best models</tspan><tspan x="656" y="298">of its day.</tspan></text>
</g>
